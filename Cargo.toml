[package]
name = "terminal-salem"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A Unix-domain-socket IPC game inspired by classic Salem"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = true

